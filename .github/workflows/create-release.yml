name: Create Release

on:
  workflow_dispatch:
    inputs:
      beta_tag:
        description: 'Beta tag to release (e.g., v0.1.0-beta.1). Leave empty to release the main branch directly.'
        required: false
        type: string
      release_type:
        description: 'Version increment when releasing without a beta tag'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # A beta tag is rebuilt from its own code; otherwise the branch the workflow runs on.
          ref: ${{ github.event.inputs.beta_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Version
        shell: pwsh
        run: |
          $betaTag = '${{ github.event.inputs.beta_tag }}'.Trim()
          if ($betaTag) {
            if ($betaTag -notmatch '^v\d+\.\d+\.\d+-beta\.\d+$') {
              Write-Error "Invalid beta tag format: $betaTag. Expected format: vX.Y.Z-beta.N"
              exit 1
            }
            $finalVersion = $betaTag -replace '^v', '' -replace '-beta\.\d+$', ''
            Write-Host "Releasing $betaTag as v$finalVersion"
          } else {
            $latest = (git tag | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Sort-Object { [version]($_ -replace '^v', '') } | Select-Object -Last 1) -replace '^v', ''
            if (-not $latest) { $latest = '0.0.0' }
            $parts = $latest.Split('.')
            $major = [int]$parts[0]; $minor = [int]$parts[1]; $patch = [int]$parts[2]
            switch ('${{ github.event.inputs.release_type }}') {
              'major' { $major++; $minor = 0; $patch = 0 }
              'minor' { $minor++; $patch = 0 }
              'patch' { $patch++ }
            }
            $finalVersion = "$major.$minor.$patch"
            Write-Host "Releasing ${{ github.ref_name }} as v$finalVersion (latest release was v$latest)"
          }
          if (git tag --list "v$finalVersion") {
            Write-Error "Tag v$finalVersion already exists."
            exit 1
          }
          "final_version=$finalVersion" >> $env:GITHUB_ENV

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Publish
        run: dotnet publish Spana.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=${{ env.final_version }}

      - name: Package with vpk
        run: vpk pack -u Spana -v ${{ env.final_version }} -p ./publish -e Spana.exe -o ./output --packTitle "Spana" --noPortable -i ./icon.ico -r win-x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Spana-Installer
          path: ./output/Spana-win-Setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Create the Final Git Tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ env.final_version }}
          git push origin v${{ env.final_version }}

      - name: Create Final GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.final_version }}
          name: "Release v${{ env.final_version }}"
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            ./output/Spana-win-Setup.exe
            ./output/RELEASES
            ./output/releases.win.json
            ./output/assets.win.json
            ./output/Spana-${{ env.final_version }}-full.nupkg

  virustotal:
    needs: release
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Download Installer
        uses: actions/download-artifact@v8
        with:
          name: Spana-Installer

      - name: Upload installer to VirusTotal
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::warning::VIRUSTOTAL_API_KEY secret not set; skipping VirusTotal upload"
            exit 0
          fi
          FILE=./Spana-win-Setup.exe
          # /files caps at 32MB; larger files need a one-time upload URL.
          UPLOAD_URL=https://www.virustotal.com/api/v3/files
          if [ "$(stat -c %s "$FILE")" -gt 33554432 ]; then
            UPLOAD_URL=$(curl -sS --fail -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r '.data')
          fi
          echo "Uploading $FILE to VirusTotal..."
          ANALYSIS_ID=$(curl -sS --fail -H "x-apikey: $VT_API_KEY" -F "file=@${FILE}" "$UPLOAD_URL" | jq -r '.data.id')
          REPORT_URL="https://www.virustotal.com/gui/file-analysis/$ANALYSIS_ID"
          echo "Spana-win-Setup.exe: $REPORT_URL"
          echo "VirusTotal: $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
